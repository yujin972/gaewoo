<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="커피, 디저트, 아쿠아리움. 개우(GAE-WOO)">
  <title>GAE-WOO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="sec sec01">
        <div class="container">
            <h2 class="en-font"><span class="point-text">C</span>OFFEE</span></h2>
            <h2 class="en-font">DESSERT</h2>
            <h2 class="en-font">AQUARIUM</h2>
        </div>
    </section>
    <section class="sec02">
        <div class="left"><img class="of-cv" src="images/main-sec02.jpg" alt="개우 어항"></div>
        <div class="right">
            <div class="inner">
                <h2 class="en-font">Healing with <br>our little friends</h2>
                <p>커피 한 잔, 그리고 어항 속 친구과 함께하는</p>
                <p class="deco">완벽한 <span></span>힐링의 공간</p>
                <p>개우에 오신 것을 환영합니다</p>
            </div>
        </div>
    </section>
    <section class="sec sec03">
      <div class="container">
        <div>
          <h2 class="en-font">“Your Peaceful Haven”</h2>
          <p><span class="pc">여유도 없이 달려온 </span>삶 가운데 잠시의 힐링이 되는 복합문화공간.</p>
          <p>어린시절의 개울가를 추억하며 마음의 안정을 찾는 곳.</p>
          <p class="deco">그곳이 바로 개우가 나아가는 종착지 <span></span> 입니다</p>
        </div>
        <ul>
          <li><img src="images/main-sec03-01.jpg" alt="커피"></li>
          <li><img src="images/main-sec03-02.jpg" alt="바스크 치즈 케이크"></li>
          <li><img src="images/main-sec03-03.jpg" alt="물고기"></li>
        </ul>
      </div>
    </section>
    <section class="sec sec04">
      <div class="container">
        <div class="sec04-head">
          <h2 class="en-font">Our Aquarium</h2>
          <div class="sec04-nav">
            <button class="sec04-prev" type="button">
              <span class="en-font">PREV</span>
            </button>
            <span class="sec04-bar" aria-hidden="true"></span>
            <button class="sec04-next" type="button">
              <span class="en-font">NEXT</span>
            </button>
          </div>
        </div>
        <div class="swiper aquarium-swiper">
          <ul class="swiper-wrapper">
            <li class="swiper-slide"><img src="images/gal-01.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-02.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-03.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-04.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-05.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-06.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-07.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-08.jpg" alt="어항"></li>
            <li class="swiper-slide"><img src="images/gal-09.jpg" alt="물고기"></li>
            <li class="swiper-slide"><img src="images/gal-10.jpg" alt="물고기"></li>
            <li class="swiper-slide"><img src="images/gal-11.jpg" alt="물고기"></li>
            <li class="swiper-slide"><img src="images/gal-12.jpg" alt="물고기"></li>
          </ul>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <div class="img-modal" hidden role="dialog" aria-modal="true" aria-label="이미지 확대">
    <button class="img-modal-close" type="button" aria-label="닫기">
      <img src="images/close.svg" alt="">
    </button>
    <button class="img-modal-prev" type="button" aria-label="이전 이미지">
      <img src="images/prev.svg" alt="">
    </button>
    <img class="img-modal-photo" alt="">
    <button class="img-modal-next" type="button" aria-label="다음 이미지">
      <img src="images/next.svg" alt="">
    </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="js/style.js" defer></script>
</body>
</html>
